[project]
name = "tapshalkar-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.54.0",
    "google-cloud-storage>=3.17.1",
    "resend>=2.29.0",
    "slowapi>=0.1.10",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "email-validator>=2.4.0",
    "anthropic>=0.96.0",
    "voyageai>=0.3.7",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "anyio>=4.16.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
