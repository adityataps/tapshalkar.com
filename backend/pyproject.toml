[project]
name = "tapshalkar-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.49.0",
    "google-cloud-storage>=3.12.0",
    "resend>=2.32.2",
    "slowapi>=0.1.10",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
    "anthropic>=0.111.0",
    "voyageai>=0.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "anyio>=4.14.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
