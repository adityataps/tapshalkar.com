version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-all:
        patterns:
          - "*"
    ignore:
      # eslint-plugin-react (via eslint-config-next) doesn't support ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # "uv" (not "pip") so Dependabot updates uv.lock alongside pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      pip-backend:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/jobs/graph-gen"
    schedule:
      interval: "weekly"
    groups:
      pip-graph-gen:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    groups:
      terraform-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-all:
        patterns:
          - "*"
